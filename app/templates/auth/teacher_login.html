{% extends "base.html" %}
{% block content %}
<h1>Вход учителя</h1>
<form method="post" action="/login/teacher" class="card">
  {{ csrf_input(request) }}
  <label>Логин <input name="username" required autofocus></label>
  <label>Пароль <input name="password" type="password" required></label>
  <button>Войти</button>
</form>
{% endblock %}
